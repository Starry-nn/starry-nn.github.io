<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Nan Yao | Portfolio</title>

<style>
:root {
  /* Premium Editorial Palette */
  --paper: #FFFFFF;       /* Pure crisp white */
  --paper-alt: #F7F7F7;   /* Subtle contrast for sections */
  --ink: #0F0F11;         /* Deep charcoal ink */
  --ink-muted: #5C5C5C;   /* Reading text gray */
  --rule: rgba(15, 15, 17, 0.12); /* Thin editorial lines */
  --rule-heavy: #0F0F11;  /* Thick editorial borders */
  --accent: #D03027;      /* Classic Editorial Red */
  --glass: rgba(255, 255, 255, 0.85);

  --max-w: 1280px;
  --measure: 720px;

  /* Typographic Stack */
  --serif: "Bodoni Moda", "Songti SC", "STSong", serif;
  --sans: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --index: "Bodoni Moda", Didot, "Bodoni 72", serif;
  --chapter-red: rgba(208, 48, 39, 0.48);
  --chapter-gray: rgba(15, 15, 17, 0.2);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15.5px;
  line-height: 1.8;
  overflow-x: clip; /* Safely prevents horizontal scroll without breaking sticky/fixed elements */
  -webkit-font-smoothing: antialiased;
}

/* Subtle print noise texture */
body::after {
  content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.035;
  background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)"/></svg>');
}

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
h1, h2, h3, h4, p, figure { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

.container { width: min(var(--max-w), calc(100% - 48px)); margin-inline: auto; }
.small-caps { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
.text-serif { font-family: var(--serif); }
.text-italic { font-style: italic; }

body.gate-active { overflow: hidden; height: 100vh; }
.gate-panel { position: fixed; left: 0; right: 0; z-index: 9998; background: var(--paper); transition: transform 1s cubic-bezier(0.76, 0, 0.24, 1); }
.gate-top { top: 0; height: 50%; border-bottom: 1px solid var(--rule); }
.gate-bottom { bottom: 0; height: 50%; border-top: 1px solid var(--rule); }
.gate-center { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; cursor: pointer; transition: opacity 0.5s ease 0.1s; color: var(--ink); }
.gate-word { font-family: var(--serif); font-weight: 400; font-style: italic; font-size: clamp(48px, 10vw, 90px); letter-spacing: -0.02em; }
.gate-line { width: 1px; height: 40px; background: var(--accent); }
.gate-hint { font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-muted); transition: color 0.3s; }
.gate-hint:hover { color: var(--accent); }
.gate-open .gate-top { transform: translateY(-100%); }
.gate-open .gate-bottom { transform: translateY(100%); }
.gate-open .gate-center { opacity: 0; pointer-events: none; }
.gate-done { display: none; }

.nav-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9000; background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid var(--rule); }
.scroll-progress { position: absolute; bottom: -1px; left: 0; height: 2px; background: var(--accent); width: 0%; transition: width 0.1s; }
.nav-inner { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.nav-brand { font-family: var(--serif); font-weight: 600; font-style: italic; font-size: 22px; letter-spacing: 0.02em; }
.nav-links { display: flex; align-items: center; gap: clamp(16px, 2vw, 30px); }
.nav-links a { font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted); transition: color 0.3s ease; }
.nav-links a:hover { color: var(--ink); }
.nav-actions { display: flex; align-items: center; gap: 20px; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.nav-actions a:hover, .nav-actions button:hover { color: var(--accent); }
.nav-divider { width: 1px; height: 14px; background: var(--rule); }

/* Infinite Marquee */
.marquee-wrap { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: var(--paper-alt); overflow: hidden; padding: 12px 0; display: flex; white-space: nowrap; }
.marquee-inner { display: flex; animation: marqueeScroll 25s linear infinite; font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); }
.marquee-item { padding: 0 40px; display: inline-flex; align-items: center; gap: 40px; }
.marquee-dot { width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
@keyframes marqueeScroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

.hero-section { padding: 140px 0 80px; }
.hero-masthead { display: flex; justify-content: space-between; border-bottom: 1px solid var(--rule); padding-bottom: 12px; margin-bottom: 50px; }

/* Status Badge */
.status-badge { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; font-weight: 600; border: 1px solid var(--rule); border-radius: 40px; padding: 6px 14px; margin-bottom: 32px; color: var(--ink); }
.status-dot { width: 6px; height: 6px; background: #10B981; border-radius: 50%; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

.hero-grid { display: grid; grid-template-columns: 1fr 420px; gap: 80px; align-items: end; }
.hero-name { font-family: var(--serif); font-size: clamp(60px, 11vw, 150px); font-weight: 500; line-height: 0.85; letter-spacing: -0.04em; margin-bottom: 40px; margin-left: -5px; }

.hero-copy-block { max-width: 600px; }
.hero-deck { font-size: 24px; font-family: var(--serif); font-style: italic; line-height: 1.4; color: var(--ink); margin-bottom: 24px; font-weight: 500; }
.hero-body { font-size: 16px; line-height: 1.8; color: var(--ink-muted); margin-bottom: 40px; }

/* Contact Strip - Editorial minimal style */
.contact-strip { display: flex; flex-wrap: wrap; gap: 28px; padding-top: 24px; border-top: 1px solid var(--rule); font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }
.contact-strip a { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); transition: color 0.2s; border-bottom: 1px solid transparent; padding-bottom: 2px;}
.contact-strip a:hover { color: var(--accent); border-color: var(--accent); }

/* Asymmetrical Hero Image */
.hero-media { position: relative; width: 100%; border: 1px solid var(--rule); padding: 12px; background: var(--paper); box-shadow: 0 20px 40px rgba(0,0,0,0.04); transform: translateY(40px); z-index: 10; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
.hero-media-inner { overflow: hidden; position: relative; aspect-ratio: 3/4; }
.hero-media img { width: 100%; height: 100%; object-fit: cover; object-position: center; transition: transform 0.8s ease; }
.hero-media:hover { transform: translateY(30px); }
.hero-media:hover img { transform: scale(1.04); }
.hero-media-cap { display: flex; justify-content: space-between; margin-top: 16px; padding: 0 4px; }

.section { padding: 120px 0; border-bottom: 1px solid var(--rule); }
.section-split { display: grid; grid-template-columns: 320px 1fr; gap: 80px; align-items: start; }

/* Sticky Left Sidebar */
.sticky-sidebar { position: sticky; top: 120px; display: flex; flex-direction: column; }
.section-num-large { font-family: var(--index); font-size: 148px; font-style: normal; font-weight: 600; line-height: 0.72; letter-spacing: -0.025em; color: var(--chapter-gray); opacity: 1; margin-bottom: 24px; margin-left: -4px; font-variant-numeric: lining-nums; }
#s0 .section-num-large, #s2 .section-num-large, #s4 .section-num-large { color: var(--chapter-red); }
.section-title { font-family: var(--serif); font-size: clamp(32px, 4vw, 48px); font-weight: 500; line-height: 1.1; margin-bottom: 16px; }
.section-desc { font-family: var(--mono); font-size: 12px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; line-height: 1.6; }

/* Experience Timeline Right Side */
.timeline-wrap { border-left: 1px solid var(--rule); margin-left: 12px; padding-left: 48px; display: flex; flex-direction: column; gap: 80px; }
.timeline-wrap:hover .exp-item { opacity: 0.4; }
.timeline-wrap .exp-item:hover { opacity: 1; }
.exp-item { position: relative; display: flex; flex-direction: column; transition: opacity 0.4s ease; }
.exp-item::before {
  content: ''; position: absolute; left: -54px; top: 8px; width: 12px; height: 12px;
  border-radius: 50%; border: 1.5px solid var(--ink); background: var(--paper);
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.exp-item:hover::before { background: var(--accent); border-color: var(--accent); transform: scale(1.4); box-shadow: 0 0 0 4px rgba(208, 48, 39, 0.15); }

.exp-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; flex-wrap: wrap; gap: 16px; }
.exp-company { font-family: var(--serif); font-size: 32px; font-weight: 600; color: var(--ink); line-height: 1.2; }
.exp-meta { display: flex; gap: 16px; text-align: right; }
.exp-role { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--accent); letter-spacing: 0.05em; margin-bottom: 20px; }

.exp-content { max-width: var(--measure); }
.exp-summary { font-size: 15.5px; line-height: 1.8; color: var(--ink); margin-bottom: 16px; font-weight: 500; }

.exp-bullet-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.exp-bullet { position: relative; padding-left: 20px; font-size: 14.5px; color: var(--ink-muted); line-height: 1.7; }
.exp-bullet::before { content: "—"; position: absolute; left: 0; color: var(--rule-heavy); font-weight: 600; }

.btn-read-more {
  display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono);
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink); border-bottom: 1px solid var(--ink); padding-bottom: 2px;
  transition: all 0.3s ease;
}
.btn-read-more .arrow { transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.btn-read-more:hover { color: var(--accent); border-color: var(--accent); }
.btn-read-more:hover .arrow { transform: translateX(6px); }

.work-section { background: var(--paper-alt); padding: 88px 0 100px; border-bottom: 1px solid var(--rule); overflow: visible; }
.work-header-wrap { margin-bottom: 40px; position: relative; display: flex; align-items: baseline; gap: 24px; }
.work-section-index { font-family: var(--index); color: var(--chapter-gray); font-size: 36px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: lining-nums; }

.hz-scroll-wrap {
  display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px;
  width: min(var(--max-w), calc(100% - 48px)); margin-inline: auto; padding: 0;
  overflow: visible;
}

.hz-card {
  min-width: 0; max-width: none; min-height: 350px;
  background: var(--paper); border: 1px solid var(--rule); border-top: 4px solid var(--ink);
  padding: 40px; position: relative; display: flex; flex-direction: column;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s ease; cursor: pointer;
}
.hz-card:nth-child(1), .hz-card:nth-child(4) { grid-column: span 7; }
.hz-card:nth-child(2), .hz-card:nth-child(3) { grid-column: span 5; }
.hz-card:hover { transform: translateY(-6px); border-top-color: var(--accent); box-shadow: 0 30px 60px rgba(0,0,0,0.055); z-index: 2; }

.work-num-bg {
  position: absolute; bottom: 0px; right: -10px; font-family: var(--serif);
  font-size: 220px; font-style: italic; color: var(--rule); opacity: 0.15;
  pointer-events: none; line-height: 0.75; transition: color 0.4s ease;
}
.hz-card:hover .work-num-bg { color: var(--accent); opacity: 0.1; }

.work-cat { display: inline-block; font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; border: 1px solid var(--rule); padding: 6px 12px; margin-bottom: 24px; color: var(--ink-muted); }
.work-period { display: block; font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: .07em; text-transform: uppercase; margin: -10px 0 18px; }
.work-title { font-family: var(--serif); font-size: 36px; font-weight: 500; line-height: 1.1; margin-bottom: 20px; position: relative; z-index: 2; color: var(--ink); }
.work-desc { font-size: 15.5px; line-height: 1.8; color: var(--ink-muted); position: relative; z-index: 2; margin-bottom: 32px; flex-grow: 1; }

.focus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
.focus-col { display: flex; flex-direction: column; border-top: 1px solid var(--rule); padding-top: 32px; }
.focus-num { font-family: var(--mono); font-size: 12px; color: var(--accent); margin-bottom: 16px; font-weight: 600; }
.focus-title { font-family: var(--serif); font-size: 24px; font-weight: 500; font-style: italic; margin-bottom: 12px; }
.focus-desc { font-size: 14.5px; line-height: 1.8; color: var(--ink-muted); }

/* Bento Box Grid */
.bento-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; }
.bento-stack { display: flex; flex-direction: column; gap: 24px; }
.bento-card { border: 1px solid var(--rule); background: var(--paper); padding: 32px; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.bento-card:hover { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.04); }

.bento-meta { font-family: var(--mono); font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; display: block; margin-bottom: 8px; }
.bento-title { font-family: var(--serif); font-size: 22px; font-weight: 500; margin-bottom: 4px; }
.bento-sub { font-size: 14px; color: var(--ink-muted); font-family: var(--mono); }

.skill-tag-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.skill-tag { font-family: var(--mono); font-size: 11px; padding: 6px 14px; border: 1px solid var(--rule); border-radius: 4px; color: var(--ink); background: var(--paper-alt); transition: all 0.2s; }
.bento-card:hover .skill-tag { border-color: rgba(208, 48, 39, 0.3); }

.footer { padding: 60px 0; border-top: 3px solid var(--rule-heavy); margin-top: 60px; }
.footer-inner { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }

.dialog { width: min(760px, calc(100% - 32px)); max-height: min(85vh, 800px); padding: 0; border: 1px solid var(--rule-heavy); background: var(--paper); box-shadow: 0 40px 100px rgba(0,0,0,0.15); margin: auto; color: var(--ink); outline: none; overflow: auto; }
.dialog::backdrop { background: rgba(250, 250, 250, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.dialog[open] { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes slideUp { from { opacity: 0; transform: translateY(80px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

.dialog-content { padding: 64px; }
.dialog-header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 32px; border-bottom: 3px solid var(--rule-heavy); margin-bottom: 32px; gap: 24px; }
.dialog-title { font-family: var(--serif); font-size: clamp(32px, 4vw, 44px); font-weight: 500; margin-bottom: 12px; line-height: 1.1; color: var(--ink); }
.dialog-meta { font-family: var(--mono); font-size: 12px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.btn-close { font-family: var(--mono); font-size: 11px; font-weight: 600; text-transform: uppercase; border: 1px solid var(--rule-heavy); padding: 10px 20px; transition: all 0.2s; background: transparent; }
.btn-close:hover { background: var(--accent); color: var(--paper); border-color: var(--accent); }
.dialog-body { font-size: 16px; line-height: 1.8; color: var(--ink); font-weight: 500; }
.dialog-list { margin-top: 32px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--rule); padding-top: 32px; }
.dialog-list li { position: relative; padding-left: 24px; font-size: 15px; color: var(--ink-muted); line-height: 1.7; }
.dialog-list li::before { content: "—"; position: absolute; left: 0; color: var(--accent); font-weight: bold; }
.dialog-actions { display: flex; align-items: center; gap: 16px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--rule); }
.dialog-link { display: inline-flex; align-items: center; gap: 10px; padding: 11px 16px; border: 1px solid var(--ink); font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; transition: background .25s ease, color .25s ease; }
.dialog-link:hover { background: var(--ink); color: var(--paper); }

.reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); transition-delay: calc(var(--delay, 0) * 100ms); }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* Responsive Adjustments */
@media (max-width: 900px) {
  .hero-grid { grid-template-columns: 1fr; gap: 40px; }
  .hero-media { transform: translateY(0); order: -1; width: 85%; margin: 0 auto; margin-bottom: 24px; }
  .hero-name { font-size: 16vw; }
  .section-split { grid-template-columns: 1fr; gap: 40px; }
  .sticky-sidebar { position: relative; top: 0; border-bottom: 1px solid var(--rule); padding-bottom: 32px; }
  .section-num-large { display: none; }
  .exp-header { flex-direction: column; gap: 8px; }
  .exp-meta { text-align: left; }
  .timeline-wrap { padding-left: 24px; margin-left: 0; border-left: 2px solid var(--rule); }
  .exp-item::before { left: -31px; }
  .focus-grid, .bento-grid { grid-template-columns: 1fr; gap: 40px; }
  .work-section { padding: 76px 0 84px; }
  .work-header-wrap { align-items: flex-start; flex-direction: column; margin-bottom: 30px; }
  .work-header-wrap .section-desc { margin-left: 0 !important; }
  .hz-scroll-wrap { grid-template-columns: 1fr; width: min(100% - 32px, var(--max-w)); gap: 18px; }
  .hz-card, .hz-card:nth-child(n) { grid-column: 1; min-width: 0; max-width: none; min-height: 320px; padding: 32px; }
  .nav-links { display: none; }
  .dialog-content { padding: 32px 24px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .reveal { opacity: 1; transform: none; }
  .marquee-inner { animation: none; }
}

/* 2026 magazine edition: tighter cover, clearer contact, standalone chapters */
.hero-section { padding: 96px 0 72px; min-height: auto; }
.hero-masthead { margin-bottom: 32px; }
.hero-grid { grid-template-columns: minmax(0, 1fr) minmax(300px, 390px); gap: clamp(48px, 7vw, 104px); align-items: center; }
.hero-copy-block { max-width: 690px; }
.hero-name { font-size: clamp(76px, 10vw, 142px); margin: 0 0 28px -6px; line-height: 0.82; }
.status-badge { margin-bottom: 28px; }
.hero-deck { max-width: 650px; font-size: clamp(22px, 2.25vw, 31px); line-height: 1.32; margin-bottom: 20px; }
.hero-body { max-width: 640px; margin-bottom: 28px; line-height: 1.75; }
.hero-media { transform: none; }
.hero-media:hover { transform: translateY(-8px); }
.hero-media-inner { aspect-ratio: 4 / 5; }
.hero-media img { object-position: 50% 42%; }
.profile-axes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 30px 0 34px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.profile-axis { padding: 18px 18px 18px 0; }
.profile-axis + .profile-axis { border-left: 1px solid var(--rule); padding-left: 18px; }
.profile-axis-title { display: block; font-family: var(--mono); color: var(--accent); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 7px; }
.profile-axis-copy { display: block; color: var(--ink-muted); font-size: 12px; line-height: 1.55; }

// Global hook for inline HTML onclick and backdrop click
window.dialog = { close: () => document.getElementById("dialog").close() };
document.getElementById('dialog').addEventListener('click', function(e) {
  if (e.target === this) this.close();
});

function setupReveals() {
  const nodes = document.querySelectorAll(".reveal:not(.visible)");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) {
    nodes.forEach(n => n.classList.add("visible"));
    return;
  }
  const ob = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add("visible");
      ob.unobserve(e.target);
    }
  }), { threshold: 0.05, rootMargin: "0px 0px -50px 0px" });
  nodes.forEach(n => ob.observe(n));
}

window.addEventListener('scroll', () => {
  const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
  const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const scrolled = (winScroll / height) * 100;
  const bar = document.getElementById("progressBar");
  if (bar) bar.style.width = scrolled + "%";
});

// Gate Logic
function openGate() {
  document.body.classList.add("gate-open");
  try { sessionStorage.setItem("nanyao-entered", "1"); } catch (e) {}
  setTimeout(() => {
    document.body.classList.remove("gate-active");
    document.getElementById("gateTop").classList.add("gate-done");
    document.getElementById("gateBottom").classList.add("gate-done");
    document.getElementById("gateCenter").classList.add("gate-done");
  }, 1000);
}

// Check session storage to skip animation on reload
if (matchMedia("(prefers-reduced-motion: reduce)").matches || (sessionStorage.getItem && sessionStorage.getItem("nanyao-entered"))) {
  document.getElementById("gateTop").classList.add("gate-done");
  document.getElementById("gateBottom").classList.add("gate-done");
  document.getElementById("gateCenter").classList.add("gate-done");
  document.body.classList.remove("gate-active");
} else {
  document.getElementById("gateCenter").addEventListener("click", openGate);
}

render();
