<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown · 开源热榜周刊</title><style>body{margin:0;background:#fbfaf6;color:#20211e;font-family:Georgia,"Songti SC","STSong",serif}header{position:sticky;top:0;display:flex;justify-content:space-between;padding:16px max(24px,calc((100vw - 820px)/2));background:#fbfaf6ee;border-bottom:1px solid #d9d7cf;font:800 13px Arial}a{color:#2747ff}article{width:min(820px,calc(100% - 40px));margin:auto;padding:75px 0 120px}h1{font:900 clamp(42px,7vw,76px)/1 Arial,"PingFang SC";letter-spacing:-.055em}h2{font:900 clamp(26px,4vw,40px)/1.1 Arial,"PingFang SC";letter-spacing:-.035em;margin:54px 0 24px;padding-top:38px;border-top:1px solid #c8c6bd}p{font-size:17px;line-height:1.9}blockquote{margin:45px 0;padding:20px 24px;border-left:5px solid #d8ff35;background:#20211e;color:#f7f5ed;line-height:1.8}</style></head><body><header><a href="index.html">← 返回网页</a><a href="latest.md" download>下载 UTF-8 .md</a></header><article id="content">读取中…</article><script>const e=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');fetch('latest.md').then(r=>r.text()).then(t=>{let out='',para=[];const flush=()=>{if(para.length){out+='<p>'+e(para.join(' '))+'</p>';para=[]}};t.replace(/^\uFEFF/,'').split(/\r?\n/).forEach(l=>{if(!l.trim())return flush();if(l.startsWith('# ')){flush();out+='<h1>'+e(l.slice(2))+'</h1>'}else if(l.startsWith('## ')){flush();out+='<h2>'+e(l.slice(3))+'</h2>'}else if(l.startsWith('> ')){flush();out+='<blockquote>'+e(l.slice(2))+'</blockquote>'}else para.push(l)});flush();content.innerHTML=out}).catch(()=>content.textContent='读取失败，请点击右上角下载 Markdown。');</script></body></html>
